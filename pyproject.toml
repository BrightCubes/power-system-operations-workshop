[project]
name = "power-system-operations-workshop"
version = "0.1.0"
description = "A workshop on power system operations using Power Grid Model."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "power-grid-model>=1.13.185",
    "power-grid-model-ds[visualizer]>=1.11.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
# Agent skills are vendored from an external repository
extend-exclude = [".agents"]

[tool.ruff.lint.per-file-ignores]
# Participants still have to use some imports
"power-system-operations-workshop.ipynb" = ["F401"]

[[tool.mypy.overrides]]
# power-grid-model-ds does not ship type information
module = ["power_grid_model_ds", "power_grid_model_ds.*"]
ignore_missing_imports = true
